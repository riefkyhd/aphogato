[package]
name = "aphogato-bridge"
version = "1.0.0"
description = "Aphogato Bridge — copy client-selected photos from a local folder"
authors = ["Aphogato"]
edition = "2021"

[lib]
name = "aphogato_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

name: Bridge build

on:
  push:
    branches: [main]
    paths:
      - "bridge/**"
      - ".github/workflows/bridge-build.yml"
  pull_request:
    paths:
      - "bridge/**"
      - ".github/workflows/bridge-build.yml"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bridge/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install bridge dependencies
        working-directory: bridge
        run: npm install

      - name: Generate icons
        working-directory: bridge
        run: npm run tauri icon src-tauri/icons/icon.png

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: bridge
          args: --verbose

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aphogato-bridge-${{ matrix.platform }}
          path: |
            bridge/src-tauri/target/release/bundle/dmg/*.dmg
            bridge/src-tauri/target/release/bundle/macos/*.app
            bridge/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
